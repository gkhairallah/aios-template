<!-- Paste verbatim as the FIRST element inside <head> of every dashboard page. Replaces the old Claude artifact runtime: downloads.save() becomes a normal browser download; every other capability reports unavailable. -->
<script>/* Standalone shim (added 2026-10-18 at migration out of Claude). Replaces the Claude artifact runtime: downloads.save() becomes a normal browser download; every other capability (mcp, db) reports unavailable so pages fall back gracefully. */window.claude=window.claude||{use:function(n){if(n!=="downloads")return Promise.resolve(null);return Promise.resolve({save:function(o){var b=(o.data instanceof Blob)?o.data:new Blob([o.data],{type:/\.pdf$/i.test(o.filename)?"application/pdf":"text/html"});var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=o.filename||"export";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000);return Promise.resolve();}});}};</script>
